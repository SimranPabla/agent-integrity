name: Publish npm packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use an npm version with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Install locked dependencies
        run: npm ci

      - name: Audit locked dependencies
        run: npm audit --audit-level=high

      - name: Require tag and workspace versions to match
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const names = ["protocol", "core", "sdk", "cli"];
          const root = JSON.parse(await readFile("package.json", "utf8"));
          if (process.env.RELEASE_TAG !== `v${root.version}`) throw new Error("release tag must equal v<root package version>");
          for (const name of names) {
            const manifest = JSON.parse(await readFile(`packages/${name}/package.json`, "utf8"));
            if (manifest.version !== root.version) throw new Error(`${name} version does not match the root version`);
          }
          NODE

      - name: Run full verification
        run: npm run verify

      - name: Fail closed on publication placeholders
        run: npm run release:check

      - name: Pack and clean-install public payloads
        run: npm run pack:check

      - name: Publish protocol
        run: npm publish ./packages/protocol --access public --provenance --tag alpha

      - name: Publish core
        run: npm publish ./packages/core --access public --provenance --tag alpha

      - name: Publish SDK
        run: npm publish ./packages/sdk --access public --provenance --tag alpha

      - name: Publish CLI
        run: npm publish ./packages/cli --access public --provenance --tag alpha
